# 로컬 개발용 PostgreSQL (+ 선택: OCR 서버).
#
# 사용법 (BE 폴더에서):
#   docker compose up -d      DB 켜기 (백그라운드)
#   docker compose ps         상태 확인 (STATUS가 healthy면 준비 완료)
#   docker compose down       DB 끄기 (데이터는 남음)
#   docker compose down -v    DB 끄고 데이터까지 삭제 (테이블을 처음부터 다시 만들고 싶을 때)
#
# 접속 정보는 application.yml의 기본값과 같다: localhost:5432 / DB otp / postgres / postgres
# 테이블은 앱이 켜질 때 Flyway가 만든다. 여기서 따로 만들 필요 없다.
#
# ⚠️ 비밀번호가 단순한 개발 전용 설정이다. 운영 DB에 이 설정을 쓰지 않는다.

services:
  postgres:
    # 테스트용 임시 DB(build.gradle의 embedded-postgres-binaries-bom 17.x)와 같은 메이저 버전.
    # 버전을 바꿀 때는 두 곳을 함께 바꾼다.
    image: postgres:17
    container_name: otp-postgres
    environment:
      POSTGRES_DB: otp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # DB 서버 시간대. 앱은 시각을 Instant(UTC 기준 절대 시각)로 저장하므로 저장값에는 영향이 없고,
      # psql 등으로 직접 조회할 때 한국 시간으로 보이게 하는 용도다.
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 왼쪽이 내 컴퓨터 포트. 이미 로컬 PostgreSQL이 5432를 쓰고 있으면
      # DB_PORT=5433 docker compose up -d 로 바꾸고, 앱은 DB_URL=jdbc:postgresql://localhost:5433/otp 로 실행한다.
      - "${DB_PORT:-5432}:5432"
    volumes:
      # 컨테이너를 지워도 데이터가 남도록 이름 있는 볼륨에 저장한다.
      - otp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # DB가 실제로 접속을 받을 수 있는 상태인지 5초마다 확인한다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d otp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 팀 OCR 서버(OCR/ocr-server). 무거워서(모델 포함 이미지 빌드에 수 분) 기본으로는 켜지 않는다.
  # 켜기:  docker compose --profile ocr up -d      (처음엔 이미지 빌드 때문에 오래 걸린다)
  # BE에서 쓰기: OCR_PROVIDER=http ./gradlew bootRun
  # 상태 확인: curl http://localhost:8000/health  ("model_loaded": true면 준비 완료)
  ocr:
    profiles: ["ocr"]
    build: ../OCR/ocr-server
    container_name: otp-ocr
    environment:
      # 비워 두면 OCR 서버가 키 없이 동작한다(로컬 개발용). 설정하면 BE도 같은 OCR_API_KEY로 실행해야 한다.
      OCR_API_KEY: ${OCR_API_KEY:-}
    ports:
      - "${OCR_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  otp-postgres-data:
