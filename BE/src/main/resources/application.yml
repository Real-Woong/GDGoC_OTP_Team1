spring:
  application:
    name: otp

  datasource:
    # 로컬 PostgreSQL 기본값. 다른 환경은 환경변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/otp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # 테이블은 Flyway(src/main/resources/db/migration)로 만들고, JPA는 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 급여명세서 이미지/PDF 업로드
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# 서비스 자체 설정
otp:
  cors:
    # 브라우저에서 이 API를 호출할 수 있는 프론트 주소 목록(쉼표로 구분).
    # 기본값: 로컬 개발 서버(Next.js 3000, Vite 5173). 배포 시 환경변수 CORS_ALLOWED_ORIGINS로 실제 도메인을 넣는다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ocr:
    # fake: 고정 샘플을 돌려주는 가짜 OCR(FakeOcrClient). 실제 제공자 연동 후 그 구현의 이름으로 바꾼다.
    provider: fake
