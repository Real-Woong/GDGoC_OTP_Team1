spring:
  application:
    name: otp

  datasource:
    # 로컬 PostgreSQL 기본값. 다른 환경은 환경변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/otp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # 테이블은 Flyway(src/main/resources/db/migration)로 만들고, JPA는 엔티티와 일치하는지만 검사한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 급여명세서 이미지/PDF 업로드
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
